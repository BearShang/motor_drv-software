<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <p>正在跳转到 <a href="{{ page.redirect_to | relative_url }}">{{ page.title | default: site.title }}</a>。</p>
    <script>
      window.location.replace("{{ page.redirect_to | relative_url }}");
    </script>
  </body>
</html>
